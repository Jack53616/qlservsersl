services:
  - type: web
    name: ql-ai-license
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install --omit=dev && cd dashboard && npm install && npm run build && cd ..
    startCommand: node index.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LICENSE_FILE
        value: /var/data/licenses.json
      - key: ADMIN_FILE
        value: /var/data/admins.json
      - key: ACTIVITY_FILE
        value: /var/data/activity.json
      - key: AVATAR_DIR
        value: /var/data/avatars
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: SEED_SUPER_ADMIN_USERNAME
        sync: false
      - key: SEED_SUPER_ADMIN_PASSWORD
        sync: false
      - key: SEED_SUPER_ADMIN_NAME
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        value: "3306"
    disk:
      name: license-data
      mountPath: /var/data
      sizeGB: 1
